services:
  api:
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-hermes}
      HERMES_BASE_URL: ${HERMES_BASE_URL:-http://host.docker.internal:8642/v1}
      WHATSAPP_SEND_ENABLED: ${WHATSAPP_SEND_ENABLED:-true}
      WHATSAPP_REQUIRE_PREFIX: ${WHATSAPP_REQUIRE_PREFIX:-true}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-xeon-ferreteria}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-xeon-evolution-local-key}

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-xeon-evolution-local-key}
      CONFIG_SESSION_PHONE_CLIENT: XEON-Ferreteria
      CONFIG_SESSION_PHONE_NAME: Chrome
      CONFIG_SESSION_PHONE_VERSION: ${CONFIG_SESSION_PHONE_VERSION:-2.3000.1043857760}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: xeon_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: ${XEON_WEBHOOK_URL:-http://api:8000/v1/channels/whatsapp/webhook}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances

  evolution-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - evolution_redisdata:/data

volumes:
  evolution_instances:
  evolution_pgdata:
  evolution_redisdata:

