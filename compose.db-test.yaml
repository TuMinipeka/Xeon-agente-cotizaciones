# Bases desechables para validar el conector SQL. Credenciales SOLO de prueba; sin volumenes.
# Uso: docker compose -f compose.db-test.yaml up -d --wait
name: xeon-db-test

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: tienda
      POSTGRES_USER: tienda_admin
      POSTGRES_PASSWORD: solo-prueba-admin
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./tests/integration/sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tienda_admin -d tienda"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_ROOT_PASSWORD: solo-prueba-root
      MYSQL_DATABASE: tienda
    ports:
      - "127.0.0.1:53450:3306"
    volumes:
      - ./tests/integration/sql/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -psolo-prueba-root"]
      interval: 3s
      timeout: 3s
      retries: 40
