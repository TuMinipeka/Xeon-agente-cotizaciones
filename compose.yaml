name: xeon

services:
  api:
    profiles: ["core"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATA_MODE: ${DATA_MODE:-synthetic}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Bogota}
      LLM_PROVIDER: ${LLM_PROVIDER:-grok}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      GROK_BASE_URL: ${GROK_BASE_URL:-https://api.reto.pltk.mx/v1}
      GROK_MODEL: ${GROK_MODEL:-grok-4.20-0309-non-reasoning}
      GROK_API_KEY_FILE: /run/secrets/grok_api_key
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-6}
      WHATSAPP_SEND_ENABLED: ${WHATSAPP_SEND_ENABLED:-false}
      KAPSO_API_BASE_URL: ${KAPSO_API_BASE_URL:-https://api.kapso.ai}
      KAPSO_API_KEY: ${KAPSO_API_KEY:-}
      KAPSO_PHONE_NUMBER_ID: ${KAPSO_PHONE_NUMBER_ID:-}
      KAPSO_WEBHOOK_SECRET_FILE: /run/secrets/kapso_webhook_secret
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v24.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - grok_api_key
      - kapso_webhook_secret
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

secrets:
  grok_api_key:
    file: ./secrets/grok_api_key.txt
  kapso_webhook_secret:
    file: ./secrets/kapso_webhook_secret.txt

