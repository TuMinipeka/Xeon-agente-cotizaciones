name: xeon

services:
  api:
    profiles: ["core"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATA_MODE: ${DATA_MODE:-synthetic}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Bogota}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-6}
      HERMES_BASE_URL: ${HERMES_BASE_URL:-http://host.docker.internal:8642/v1}
      HERMES_MODEL: ${HERMES_MODEL:-gpt-5.6-luna}
      HERMES_API_KEY: ${HERMES_API_KEY:-xeon-hermes-local-bridge-2026}
      WHATSAPP_SEND_ENABLED: ${WHATSAPP_SEND_ENABLED:-false}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api:8080}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-xeon-ferreteria}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-xeon-evolution-local-key}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

